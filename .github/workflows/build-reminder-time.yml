
name: Build PayTrack Reminder Time V2

on:
  workflow_dispatch:
  push:
    branches:
      - paytrack-v2-reminder-time
    paths:
      - 'PayTrack-Reminder-Time-v2.zip'
      - '.github/workflows/build-reminder-time.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and Test PayTrack V2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract V2 source project
        run: |
          unzip -q PayTrack-Reminder-Time-v2.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found in ZIP"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle --no-daemon -p "$PROJECT_DIR" testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: PayTrack-Reminder-Time-v2-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
